{% if MULTI_IMAGE == 'yes' %}
IMAGES_FILE_PATH=images.yaml
{% endif %}
SIT_OC_URL={{ SIT_OC_URL }}
UAT_OC_URL={{ UAT_OC_URL }}
ADC_OC_URL={{ ADC_OC_URL }}
TDC_OC_URL={{ TDC_OC_URL }}
SIT_CLOUD={{ SIT_CLOUD }}
UAT_CLOUD={{ UAT_CLOUD }}
PRD_CLOUD={{ PRD_CLOUD }}
DR_CLOUD={{ DR_CLOUD }}
SIT_APP_OC_CREDENTIAL_ID=INT-T-{{ APP_CODE }}-ECP
UAT_APP_OC_CREDENTIAL_ID=INT-U-{{ APP_CODE }}-ECP
PRD_APP_ADC_OC_CREDENTIAL_ID=INT-P-{{ APP_CODE }}-ECP
PRD_APP_TDC_OC_CREDENTIAL_ID=INT-P-{{ APP_CODE }}-ECP
CLUSTER_NETWORK={{ CLUSTER_NETWORK }}
IS_QUAY={% if IS_QUAY == 'yes' %}true{% else %}false{% endif %}
SIT_DOCKER_REPO_NAME={{ SIT_DOCKER_REPO_NAME }}
UAT_DOCKER_REPO_NAME={{ UAT_DOCKER_REPO_NAME }}
PRD_DOCKER_REPO_NAME={{ PRD_DOCKER_REPO_NAME }}
IS_STATIC_AGENT={% if IS_STATIC_AGENT == 'yes' %}true{% else %}false{% endif %}
